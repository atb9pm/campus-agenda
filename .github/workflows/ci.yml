# Tests automatiques sur chaque pull request (avant merge).
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: web
        run: npm install

      - name: Tests unitaires (memory store)
        working-directory: web
        run: |
          CAMPUS_STORE=memory AUTH_SECRET=test-secret-ci \
            node --experimental-strip-types --test \
            ../tests/classes.test.ts \
            ../tests/auth.test.ts \
            ../tests/auth-entry.test.ts \
            ../tests/accessibility.test.ts \
            ../tests/persistence.test.ts \
            ../tests/sqlite-store.test.ts \
            ../tests/teacher.test.ts \
            ../tests/teacher-setup.test.ts \
            ../tests/school-catalog.test.ts \
            ../tests/school-days.test.ts \
            ../tests/teacher-accounts.test.ts \
            ../tests/school-calendar.test.ts \
            ../tests/publications.test.ts \
            ../tests/student.test.ts \
            ../tests/api-auth.test.ts \
            ../tests/multi-year-operations.test.ts

      - name: Build production
        working-directory: web
        run: npm run build

      # Garde-fou déploiement : le rendu et les API doivent répondre sur le build
      # réellement produit, sinon un merge « vert » casserait la prod.
      - name: Tests de rendu et API sur le build
        working-directory: web
        run: |
          CAMPUS_STORE=memory AUTH_SECRET=test-secret-ci \
            node --test tests/rendered-html.test.mjs tests/e2e-api.test.mjs
