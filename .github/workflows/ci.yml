# Tests automatiques sur chaque pull request (avant merge).
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Tests, typecheck, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm test` enchaîne `pnpm run build` : pnpm doit être disponible.
      - name: Activer pnpm
        run: corepack enable

      # pdfjs-dist est résolu depuis `src/` (node_modules à la racine du dépôt).
      - name: Installer les dépendances racine
        run: npm ci

      - name: Installer les dépendances web
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      # Suite de référence : unitaires + build + rendu/API + smoke preview.
      - name: Suite de tests (npm test)
        working-directory: web
        run: npm test
