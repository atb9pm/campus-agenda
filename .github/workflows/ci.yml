# Tests automatiques sur chaque pull request (avant merge).
# Une seule source de vérité : le script `npm test` de web/package.json.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm test` enchaîne `pnpm run build` : pnpm doit être disponible.
      - name: Activer pnpm
        run: corepack enable

      # pdfjs-dist est résolu depuis `src/` (node_modules à la racine du dépôt).
      - name: Installer les dépendances racine
        run: npm install

      - name: Installer les dépendances web
        working-directory: web
        run: npm install

      # Suite de référence : unitaires + build + rendu/API + smoke preview.
      # Tout nouveau fichier ajouté à `npm test` est couvert automatiquement.
      - name: Suite de tests (npm test)
        working-directory: web
        run: npm test
