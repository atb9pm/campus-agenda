# Infomaniak Node.js n’expose pas encore de secret SSH utilisable depuis Actions.
# Le déploiement réel se fait dans le Manager (Build puis Redémarrer).
# Ce workflow ne touche plus au serveur : il vérifie que campusagenda.ch répond.
name: Deploy Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      wait_for_commit:
        description: Attendre que /api/health serve le commit de cette exécution
        type: boolean
        default: false

concurrency:
  group: deploy-infomaniak
  cancel-in-progress: true

jobs:
  health:
    name: Vérifier campusagenda.ch
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      HEALTH_URL: https://campusagenda.ch/api/health
      WAIT_FOR_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.wait_for_commit == 'true' }}

    steps:
      - name: Vérifier /api/health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_SHA:0:7}"
          attempts=4
          if [ "$WAIT_FOR_COMMIT" = "true" ]; then
            attempts=16
            echo "Attente du commit ${expected} sur ${HEALTH_URL}…"
          fi

          i=1
          while [ "$i" -le "$attempts" ]; do
            if body=$(curl -fsS --max-time 20 "$HEALTH_URL"); then
              echo "$body"
              parsed=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(("1" if d.get("ok") is True else "0")+"\t"+(d.get("commit") or "")+"\t"+(d.get("version") or "")+"\t"+(d.get("store") or ""))')
              ok=$(printf '%s' "$parsed" | cut -f1)
              commit=$(printf '%s' "$parsed" | cut -f2)
              version=$(printf '%s' "$parsed" | cut -f3)
              store=$(printf '%s' "$parsed" | cut -f4)
              if [ "$ok" != "1" ]; then
                echo "::error::Le site répond mais ok n’est pas true."
                exit 1
              fi
              echo "version=${version} store=${store} commit=${commit} attendu=${expected}"
              if [ -n "$commit" ] && [ "$commit" = "$expected" ]; then
                echo "✓ Production à jour (${commit})."
                exit 0
              fi
              if [ "$WAIT_FOR_COMMIT" = "true" ]; then
                echo "Commit encore ${commit:-inconnu}, tentative ${i}/${attempts}…"
              else
                echo "::notice::Le site répond (${version}, ${commit:-sans commit}). Main est ${expected}. Lancez Build puis Redémarrer dans Infomaniak si ce n’est pas déjà fait."
                exit 0
              fi
            else
              echo "Santé injoignable, tentative ${i}/${attempts}…"
              if [ "$i" -eq "$attempts" ]; then
                echo "::error::https://campusagenda.ch/api/health ne répond pas."
                exit 1
              fi
            fi
            i=$((i + 1))
            sleep 15
          done

          echo "::error::Production pas encore sur ${expected} après attente."
          exit 1
