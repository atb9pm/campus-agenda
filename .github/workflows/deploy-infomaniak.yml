# Déploie campusagenda.ch sur Infomaniak après merge d'une PR sur main.
name: Deploy Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branche Git à déployer
        required: false
        default: main

concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer sur Infomaniak
    runs-on: ubuntu-latest

    env:
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'main' }}
      HEALTH_URL: https://campusagenda.ch/api/health
      SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
      SSH_USER: ${{ secrets.INFOMANIAK_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
      SITE_DIR: ${{ secrets.INFOMANIAK_SITE_DIR }}
      MANAGER_SESSION: ${{ secrets.INFOMANIAK_SASESSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les secrets de déploiement
        id: secrets
        run: |
          missing=0
          [ -n "$SSH_HOST" ] || { echo "::warning::INFOMANIAK_SSH_HOST manquant"; missing=1; }
          [ -n "$SSH_USER" ] || { echo "::warning::INFOMANIAK_SSH_USER manquant"; missing=1; }
          [ -n "$SITE_DIR" ] || { echo "::warning::INFOMANIAK_SITE_DIR manquant"; missing=1; }
          if [ -n "$SSH_KEY" ] || [ -n "$SSH_PASSWORD" ]; then
            :
          else
            echo "::warning::INFOMANIAK_SSH_KEY ou INFOMANIAK_SSH_PASSWORD requis"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Secrets incomplets — déploiement impossible. Voir docs/infomaniak-deploy.md"
            echo "Requis : INFOMANIAK_SSH_HOST, INFOMANIAK_SSH_USER, INFOMANIAK_SITE_DIR,"
            echo "         et INFOMANIAK_SSH_PASSWORD (ou INFOMANIAK_SSH_KEY)"
            exit 1
          fi

      - name: Build et mise à jour du code (SSH)
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          INFOMANIAK_SITE_DIR: ${{ secrets.INFOMANIAK_SITE_DIR }}
        with:
          host: ${{ secrets.INFOMANIAK_SSH_HOST }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          key: ${{ secrets.INFOMANIAK_SSH_KEY }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          port: 22
          script_stop: true
          envs: INFOMANIAK_SITE_DIR,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
            SITE_DIR="${INFOMANIAK_SITE_DIR:?INFOMANIAK_SITE_DIR manquant dans les secrets GitHub}"
            cd "${SITE_DIR}"
            git fetch origin "${DEPLOY_BRANCH}"
            git reset --hard "origin/${DEPLOY_BRANCH}"
            cd web
            npm install
            npm run build
            echo "✓ Build OK ($(git -C .. rev-parse --short HEAD))"

      - name: Redémarrer l'application (API Manager Infomaniak)
        if: ${{ steps.secrets.outputs.ready == 'true' && env.MANAGER_SESSION != '' }}
        env:
          INFOMANIAK_HOSTING_ID: ${{ secrets.INFOMANIAK_HOSTING_ID }}
          INFOMANIAK_VHOST_ROUTE_ID: ${{ secrets.INFOMANIAK_VHOST_ROUTE_ID }}
          INFOMANIAK_SASESSION: ${{ secrets.INFOMANIAK_SASESSION }}
          INFOMANIAK_MANAGER_XSRF: ${{ secrets.INFOMANIAK_MANAGER_XSRF }}
        run: node scripts/trigger-infomaniak-action.mjs restart

      - name: Vérifier /api/health
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        run: |
          echo "Attente du redémarrage…"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "${HEALTH_URL}" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "✓ Santé OK : ${HEALTH_URL}"
              curl -fsS "${HEALTH_URL}"
              exit 0
            fi
            echo "Tentative ${attempt}/6…"
            sleep 15
          done
          echo "❌ Le site ne répond pas correctement après déploiement."
          exit 1
