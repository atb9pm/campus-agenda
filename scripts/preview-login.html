<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Campus Agenda — Connexion preview</title>
  <style>
    :root { --navy: #1a2744; --bg: #f3f5f8; --card: #fff; --line: #dde3ec; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--navy);
    }
    main {
      width: min(420px, calc(100vw - 32px));
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 28px 24px 22px; box-shadow: 0 18px 40px rgba(26,39,68,.08);
    }
    .eyebrow {
      font-size: 10px; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; color: #7a8698; margin-bottom: 8px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 18px; line-height: 1.5; color: #526074; font-size: 14px; }
    label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 12px; font-weight: 700; }
    select, input, button {
      font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 11px 12px;
    }
    button {
      width: 100%; margin-top: 6px; border: 0; background: var(--navy); color: #fff;
      font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .hint { font-size: 12px; color: #526074; margin: 8px 0 0; }
    .error { color: #b42318; font-size: 13px; min-height: 1.2em; margin-top: 8px; }
    .status {
      margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
      font-size: 11px; color: #7a8698; line-height: 1.6;
    }
    .ok { color: #067647; font-weight: 700; }
    .bad { color: #b42318; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Preview Node · Campus Agenda</div>
    <h1>Connexion</h1>
    <p>Page de connexion statique — fonctionne sans React ni cache navigateur.</p>

    <form id="login-form">
      <label>
        Compte enseignant
        <select id="teacherId" name="teacherId">
          <option value="teacher-demo-current">Prof. Démo (vous)</option>
          <option value="teacher-demo-dupont">Prof. Dupont</option>
          <option value="teacher-demo-martin">Prof. Martin</option>
        </select>
      </label>
      <label>
        Mot de passe
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <p class="hint">Mot de passe démo : <strong>campus-demo</strong></p>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="submit">Se connecter</button>
    </form>

    <div class="status" id="status">Vérification du serveur…</div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const form = document.getElementById("login-form");
    const submit = document.getElementById("submit");

    fetch("/api/preview-info", { cache: "no-store" })
      .then((res) => res.json())
      .then((info) => {
        statusEl.innerHTML =
          '<span class="ok">Serveur OK</span> · version ' + info.version +
          '<br>Ouvrez cette page dans <strong>Chrome ou Edge</strong> (pas l’aperçu Cursor).';
      })
      .catch(() => {
        statusEl.innerHTML =
          '<span class="bad">Serveur inaccessible</span><br>' +
          'Vérifiez que <code>pnpm.cmd run preview:node</code> tourne dans PowerShell.';
      });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";
      submit.disabled = true;
      submit.textContent = "Connexion…";
      try {
        const response = await fetch("/api/auth/teacher", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            teacherId: document.getElementById("teacherId").value,
            password: document.getElementById("password").value,
          }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.reason || "Connexion impossible.");
        }
        window.location.href = "/?preview-login=1&_=" + Date.now();
      } catch (error) {
        errorEl.textContent = error instanceof Error ? error.message : "Connexion impossible.";
      } finally {
        submit.disabled = false;
        submit.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
